<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="28" y="28" width="456" height="456" rx="108" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4"/>

  <!-- Hands Holding Child / Protective Grace Symbol -->
  <g fill="#ffffff">
    <!-- Child Figure (Head & Body) -->
    <circle cx="256" cy="180" r="38"/>
    <path d="M226,236 C226,220 286,220 286,236 L292,300 C292,314 220,314 220,300 Z" opacity="0.95"/>
    
    <!-- Left Hand / Wing Wrapping In Grace -->
    <path d="M128,340 C128,300 160,260 196,240 C206,234 216,248 208,256 C182,282 168,310 172,344 C176,378 208,396 244,396 C220,412 184,412 156,396 C136,382 128,362 128,340 Z"/>
    
    <!-- Right Hand / Wing Wrapping In Grace -->
    <path d="M384,340 C384,300 352,260 316,240 C306,234 296,248 304,256 C330,282 344,310 340,344 C336,378 304,396 268,396 C292,412 328,412 356,396 C376,382 384,362 384,340 Z"/>

    <!-- Protective Base Arch -->
    <path d="M200,396 C236,416 276,416 312,396 C322,408 306,424 286,432 C266,438 246,438 226,432 C206,424 190,408 200,396 Z" opacity="0.9"/>
  </g>
</svg>
